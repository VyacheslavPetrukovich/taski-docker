volumes:
  pg_data:
  static:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    volumes:
      - static:/backend_static
    build: ./backend/
    env_file: .env
    depends_on:
      - db

  frontend:
    env_file: .env
    build: ./frontend/
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    volumes:
      - static:/staticfiles
    build: ./gateway/
    ports:
    - "8000:80"

